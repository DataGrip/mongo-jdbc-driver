plugins {
    id 'java'
    id "org.jetbrains.kotlin.jvm" version "1.9.25"
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

version '1.24'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

tasks.register('verifyDriverVersion') {
    def metaFile = file('src/main/java/com/dbschema/mongo/MongoDatabaseMetaData.java')
    def expected = project.version.toString()
    inputs.file(metaFile)
    inputs.property('version', expected)
    doLast {
        def matcher = (metaFile.text =~ /DRIVER_VERSION\s*=\s*"([^"]+)"/)
        if (!matcher.find()) {
            throw new GradleException("Could not find the DRIVER_VERSION literal in ${metaFile}")
        }
        def actual = matcher.group(1)
        if (actual != expected) {
            throw new GradleException(
                "Driver version mismatch: MongoDatabaseMetaData.DRIVER_VERSION is '${actual}' " +
                "but the Gradle version is '${expected}'. Update the constant to keep them in sync -- the " +
                "major and the minor version are derived from it.")
        }
        // the major and the minor are derived from this literal, so a qualifier would be reported as a
        // version it is not: '1.25-rc1' reads as 1.25. Rejected here rather than at runtime.
        if (!(actual ==~ /\d+(\.\d+)*/)) {
            throw new GradleException(
                "MongoDatabaseMetaData.DRIVER_VERSION is '${actual}', which is not a dotted numeric " +
                "version. The major and the minor version reported over JDBC are derived from it, so a " +
                "qualifier would be silently dropped. Release from a numeric version.")
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'verifyDriverVersion'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "org.mongodb:mongodb-driver-sync:5.6.1"
    implementation "org.jetbrains:annotations:15.0"
    implementation "org.apache.commons:commons-text:1.10.0"
    implementation "org.graalvm.js:js:25.0.1"
    implementation files('libs/JMongosh-0.9.1.jar')
    implementation "com.nimbusds:oauth2-oidc-sdk:11.23.1"
    implementation "org.graalvm.polyglot:polyglot:25.0.1"
    testImplementation "junit:junit:4.13.1"
    testImplementation "commons-io:commons-io:2.14.0"
}

test {
    minHeapSize = "512m"
    maxHeapSize = "1024m"
}

shadowJar {
    archiveFileName = "mongo-jdbc-standalone-${version}.jar"
    mergeServiceFiles()
    manifest {
        attributes('Multi-Release' : 'true')
    }
}